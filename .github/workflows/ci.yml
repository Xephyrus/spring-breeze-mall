name: CI

# 前端门禁随 push/PR 自动跑；后端编译较重，只在手动触发时跑
on:
  push:
    branches: [main]
    paths:
      - 'apps/manager/**'
      - 'apps/seller/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/manager/**'
      - 'apps/seller/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
  # 手动触发：升级依赖、改后端后想立刻验一遍
  workflow_dispatch:

# 同一分支只保留最新一次，避免排队浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manager:
    name: manager · typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型门：严格模式 + strictTemplates，0 错误才算通过
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/manager typecheck

      # Lint 门：--max-warnings 67 写在 package.json 的 lint 脚本里，
      # 这是「只减不增」的 ratchet，改脚本才能放宽，评审时一眼可见
      - name: Lint (ratchet)
        run: pnpm --filter @spring-breeze/manager lint

      # 构建门：产物构建通过（大项目需要抬高 Node 堆，否则 Rolldown 会 OOM）
      - name: Build
        run: pnpm --filter @spring-breeze/manager build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  seller:
    name: seller · typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型门：seller 已全量 TS（strict），装修子系统仍豁免命名但同样过类型检查
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/seller typecheck

      # Lint 门：ratchet 值写在 seller 的 package.json lint 脚本里（当前 58）
      - name: Lint (ratchet)
        run: pnpm --filter @spring-breeze/seller lint

      - name: Build
        run: pnpm --filter @spring-breeze/seller build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  backend-compile:
    name: backend · compile (manual)
    # 只在手动触发时跑：编译一次约 5-8 分钟，随每次 push 跑性价比不高
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      # 只编译 framework + manager-api（含 timetask / setting 相关类），不做打包
      - name: Compile (framework + manager-api)
        working-directory: backend
        run: ./mvnw -B -DskipTests -pl manager-api -am compile
