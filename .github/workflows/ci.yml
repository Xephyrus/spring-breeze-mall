name: CI

# 前端门禁随 push/PR 自动跑；后端编译较重，只在手动触发时跑
on:
  push:
    branches: [main]
    paths:
      - 'apps/manager/**'
      - 'apps/seller/**'
      - 'apps/im/**'
      - 'apps/buyer/**'
      - 'apps/uniapp/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/manager/**'
      - 'apps/seller/**'
      - 'apps/im/**'
      - 'apps/buyer/**'
      - 'apps/uniapp/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
  # 手动触发：升级依赖、改后端后想立刻验一遍
  workflow_dispatch:

# 同一分支只保留最新一次，避免排队浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 大小写敏感性预检：Windows 上 typecheck 能过、Linux 会挂的典型原因
  # （改名只改大小写、import 大小写与磁盘不一致）
  precheck:
    name: precheck · import 大小写一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 把结果写进 ::error::，即使拿不到日志，Summary 页的 Annotations 也能看到具体文件
      - name: Precheck (case / secrets / tag selectors)
        run: |
          set +e
          {
            echo "== 大小写一致性 =="
            node scripts/check-case-sensitivity.mjs
            cs=$?
            echo "== 凭据扫描 =="
            node scripts/check-secrets.mjs
            ss=$?
            echo "== 标签选择器（小程序样式） =="
            node scripts/check-tag-selectors.mjs
            ts=$?
          } 2>&1 | tee precheck.log
          exit $(( cs != 0 || ss != 0 || ts != 0 ? 1 : 0 ))

      - name: Annotate failures
        if: failure()
        run: |
          echo "::error::precheck 失败，明细如下（节选）"
          sed -n '1,40p' precheck.log | sed 's/^/::error::/'
  manager:
    name: manager · typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型门：严格模式 + strictTemplates，0 错误才算通过
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/manager typecheck

      # Lint 门：--max-warnings 67 写在 package.json 的 lint 脚本里，
      # 这是「只减不增」的 ratchet，改脚本才能放宽，评审时一眼可见
      - name: Lint (ratchet)
        run: pnpm --filter @spring-breeze/manager lint

      # 构建门：产物构建通过（大项目需要抬高 Node 堆，否则 Rolldown 会 OOM）
      - name: Build
        run: pnpm --filter @spring-breeze/manager build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  seller:
    name: seller · typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型门：seller 已全量 TS（strict），装修子系统仍豁免命名但同样过类型检查
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/seller typecheck

      # Lint 门：ratchet 值写在 seller 的 package.json lint 脚本里（当前 58）
      - name: Lint (ratchet)
        run: pnpm --filter @spring-breeze/seller lint

      # 导航回归（Node 内置测试运行器）：权限裁剪、详情页归属、跨分组检索
      - name: Test (navigation)
        run: pnpm --filter @spring-breeze/seller test

      - name: Build
        run: pnpm --filter @spring-breeze/seller build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  im:
    name: im · typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # im 已全量 TS（src 下 0 个 .js，唯一例外是装修预设数据亦已转换）
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/im typecheck

      # Lint 门：im 的 ratchet 已收紧到 --max-warnings 0
      - name: Lint (ratchet 0)
        run: pnpm --filter @spring-breeze/im lint

      - name: Build
        run: pnpm --filter @spring-breeze/im build

  buyer:
    name: buyer · typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # buyer 已全量 TS（仅 double11Preset.js 作为纯数据豁免）
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/buyer typecheck

      # Lint 门：ratchet 已收紧到 --max-warnings 0
      - name: Lint (ratchet 0)
        run: pnpm --filter @spring-breeze/buyer lint

      - name: Build
        run: pnpm --filter @spring-breeze/buyer build
        env:
          NODE_OPTIONS: --max-old-space-size=3072
  uniapp:
    name: uniapp · typecheck / lint / node 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # uni-app 的构建在 HBuilderX 里做（CI 无法产出 H5/小程序/App 包），
      # 这里只跑静态门禁：类型检查 + lint + 5 个 node 脚本测试。
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @spring-breeze/uniapp typecheck

      - name: Lint (ratchet)
        run: pnpm --filter @spring-breeze/uniapp lint

      - name: Node tests (lottery / payment / sku / evaluation / mqtt)
        run: pnpm --filter @spring-breeze/uniapp test
  backend-compile:
    name: backend · compile (manual)
    # 只在手动触发时跑：编译一次约 5-8 分钟，随每次 push 跑性价比不高
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      # 只编译 framework + manager-api（含 timetask / setting 相关类），不做打包
      - name: Compile (framework + manager-api)
        working-directory: backend
        run: ./mvnw -B -DskipTests -pl manager-api -am compile
